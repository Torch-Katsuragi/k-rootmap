# Windows / Android の両対応を壊さないためのCI。
#
# 端末が要る段（integration_test の実機実行）はCIでは回さない。
# それはローカルの tool/test_matrix.ps1 の担当。
# ここは「片方のプラットフォームだけ壊す変更」を最短で検出するためのゲートに絞る。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  analyze-and-unit:
    name: analyze + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # web版が「コンパイルすら通らない」状態に戻るのを防ぐゲート。
      # ⚠ ビルドが通っても実行時に落ちうる（`dart:io` は web で
      #    「コンパイルは通るが呼ぶと落ちるスタブ」として出力されるため）。
      #    実行時の確認は手動（docs/technical/testing 参照）。
      - run: flutter build web --release

  build-android:
    name: build (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
